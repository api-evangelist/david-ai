aid: david-ai
name: David AI
description: >-
  David AI is an audio data research company building high-quality speech and
  conversational datasets to bring AI into the real world through voice. Using a
  rigorous six-step research process (hypothesize, design, experiment, evaluate,
  productionize, release), the team produces datasets such as Converse
  (channel-separated two-speaker English conversations), Atlas (multilingual data
  spanning 15+ languages with dialect and accent metadata), Chorus (multi-speaker
  conversations for speaker separation and diarization), and Dialog (expert
  domain conversations). Its data is licensed to Fortune 100 companies and
  research labs working on speech recognition, translation, synthesis, and
  conversational AI. Access is arranged through samples, consultation, and a data
  license agreement rather than a self-serve API. David AI is backed by Amplify
  Partners. This profile was added to the API Evangelist network as a portfolio
  lead and enriched from the company's public web presence.
